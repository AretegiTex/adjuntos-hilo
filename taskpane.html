<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adjuntos del hilo</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="msal-browser.min.js"></script>
  <script src="config.js"></script>
  <script src="pdfvisor.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1 id="asunto" class="subject" title=""></h1>
      <button id="btnRecargar" class="icon-btn" title="Actualizar" aria-label="Actualizar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3.3h-3.3"/>
        </svg>
      </button>
    </div>
    <div class="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/>
      </svg>
      <input id="filtro" type="search" placeholder="Buscar archivo" autocomplete="off" spellcheck="false">
    </div>
    <div class="toolbar-row">
      <div class="toggles">
        <label class="switch" title="Si un archivo con el mismo nombre aparece varias veces, muestra solo el más reciente">
          <input type="checkbox" id="chkVersiones" checked autocomplete="off">
          <span class="track"></span>
          <span class="switch-label">Últimas versiones<span id="lblVersiones" class="switch-extra"></span></span>
        </label>
        <label class="switch" title="Logotipos de firma y otras imágenes incrustadas en el cuerpo del correo">
          <input type="checkbox" id="chkInline" autocomplete="off">
          <span class="track"></span>
          <span class="switch-label">Imágenes incrustadas</span>
        </label>
      </div>
      <button id="btnTodos" class="btn primary" disabled>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 2.5v8"/><path d="m5 7.5 3 3 3-3"/><path d="M2.5 11.5v1.5a.5.5 0 0 0 .5.5h10a.5.5 0 0 0 .5-.5v-1.5"/>
        </svg>
        <span id="btnTodosTexto">Descargar todo</span>
      </button>
    </div>
  </header>

  <div id="estado" class="banner" role="status" aria-live="polite"></div>

  <div id="login" class="card oculto">
    <p>Permiso de lectura necesario</p>
    <p>Para listar los archivos de la conversación, el panel necesita leer tu buzón. Se pide una sola vez.</p>
    <button id="btnLogin" class="btn primary">Iniciar sesión</button>
  </div>

  <main id="lista" class="thread"></main>

  <footer class="foot">
    <span id="resumen" class="summary"></span>
    <span id="pie" class="hint"></span>
  </footer>

  <script src="taskpane.js"></script>
</body>
</html>
